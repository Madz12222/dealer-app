<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Cosmogems Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm text-center" style="max-width: 400px; width: 100%;">
        <h3 class="text-primary mb-3">Verify OTP</h3>
        {% if error %}
        <div class="alert alert-danger p-2 small">{{ error }}</div>
        {% endif %}
        <p class="small text-muted">Click below to send the OTP via WhatsApp, or use testing code displayed below.</p>
        
        <a href="{{ wa_url }}" target="_blank" class="btn btn-success mb-3 w-100 py-2 fw-bold">💬 Open WhatsApp to Send OTP</a>
        
        <div class="alert alert-info py-2 small">For Testing/Instant Demo, your OTP is: <strong>{{ otp }}</strong></div>

        <form method="POST" action="/dealer/verify-otp">
            <input type="hidden" name="mobile" value="{{ mobile }}">
            <div class="mb-3">
                <input type="text" name="otp" class="form-control text-center fs-4 tracking-widest" placeholder="Enter 4-digit OTP" required maxlength="4">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Verify & Login</button>
        </form>
    </div>
</body>
</html>
