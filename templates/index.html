<!DOCTYPE html>
<html>
<head>
    <title>Cosmogems Pollution Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container" style="max-width: 650px;">
        <h2 class="text-center text-primary mb-3">Cosmogems Pollution Center</h2>
        
        <div class="card p-3 mb-3 shadow-sm bg-white">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Vehicle Number:</label>
                    <div class="input-group">
                        <input type="text" id="vehicle_number" name="vehicle_number" class="form-control" placeholder="e.g. TN10BZ8419" required style="text-transform: uppercase;">
                        <button type="button" class="btn btn-primary" onclick="fetchVehicleRC()">🔍 Fetch RC</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Owner Name:</label>
                    <input type="text" id="owner_name" name="owner_name" class="form-control bg-light" placeholder="Fetched owner name" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-success">Owner Mobile Number (Fetched from RC):</label>
                    <input type="tel" id="owner_mobile" name="owner_mobile" class="form-control bg-light" placeholder="Owner mobile number" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">Send WhatsApp To Number (Enter Any Number):</label>
                    <input type="tel" id="mobile_number" name="mobile_number" class="form-control border-primary" placeholder="Enter recipient mobile number (dealer/customer)" required>
                    <div class="form-text">You can type any mobile number here to send the WhatsApp message to them.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Full Address:</label>
                    <textarea id="address" name="address" class="form-control bg-light" rows="2" placeholder="Fetched owner address" readonly></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Chassis Number:</label>
                        <input type="text" id="chassis" name="chassis" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Engine Number:</label>
                        <input type="text" id="engine" name="engine" class="form-control bg-light" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Vehicle Type & Model:</label>
                    <input type="text" id="vehicle_type" name="vehicle_type" class="form-control" placeholder="Vehicle make and model" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">RC Expiry Date:</label>
                        <input type="text" id="rc_expiry" name="rc_expiry" class="form-control bg-light" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Insurance Upto:</label>
                        <input type="text" id="insurance_upto" name="insurance_upto" class="form-control bg-light" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Financer / Hypothecation:</label>
                    <input type="text" id="financer" name="financer" class="form-control bg-light" placeholder="Financer details" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Validity Period:</label>
                    <input type="text" name="validity_period" class="form-control" value="6 Months">
                </div>

                <button type="submit" name="add_entry" class="btn btn-success w-100 py-2 fw-bold">Save & Send WhatsApp</button>
            </form>
        </div>

        <div class="card p-3 shadow-sm bg-white">
            <h5 class="text-secondary mb-2">Collection Summary</h5>
            <p class="mb-1">Today's Date: <strong>{{ today }}</strong></p>
            <p class="mb-1 text-success">Gross Collection: <strong>₹ {{ gross_collection }} (Vehicles: {{ vehicle_count }})</strong></p>
            <p class="mb-0 text-primary">Net Balance: <strong>₹ {{ net_balance }}</strong></p>
        </div>
    </div>

    <script>
    function fetchVehicleRC() {
        let vehNum = document.getElementById('vehicle_number').value.trim();
        if(!vehNum) {
            alert('Please enter a vehicle number first.');
            return;
        }

        let btn = event.target;
        btn.innerText = "Fetching...";
        btn.disabled = true;

        fetch('/fetch_rc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vehicle_number: vehNum })
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = "🔍 Fetch RC";
            btn.disabled = false;
            
            if(data.success) {
                document.getElementById('owner_name').value = data.owner || '';
                document.getElementById('owner_mobile').value = data.mobile_number || '';
                // Keep recipient mobile number separate/editable so you can type any number
                document.getElementById('address').value = data.address || '';
                document.getElementById('chassis').value = data.chassis || '';
                document.getElementById('engine').value = data.engine || '';
                document.getElementById('vehicle_type').value = data.vehicle_type || '';
                document.getElementById('rc_expiry').value = data.rc_expiry || '';
                document.getElementById('insurance_upto').value = data.insurance_upto || '';
                document.getElementById('financer').value = data.financer || 'None';
            } else {
                alert('Error: ' + (data.error || 'Could not fetch details'));
            }
        })
        .catch(err => {
            btn.innerText = "🔍 Fetch RC";
            btn.disabled = false;
            alert('Network error connecting to API.');
        });
    }
    </script>
</body>
</html>
