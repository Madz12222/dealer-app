<!DOCTYPE html>
<html>
<head>
    <title>Manage Expenses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container" style="max-width: 600px;">
        <h2 class="text-center mb-3">Expense Management</h2>
        <div class="text-center mb-3">
            <a href="/" class="btn btn-outline-primary btn-sm">← Back to Dashboard</a>
        </div>

        <!-- Add Expense Form -->
        <div class="card p-3 mb-4 shadow-sm border-danger">
            <h5 class="text-danger">Add Expense</h5>
            <form method="POST">
                <div class="mb-2">
                    <input type="text" name="description" class="form-control" placeholder="Expense Description" required>
                </div>
                <div class="mb-2">
                    <input type="number" name="expense_amount" class="form-control" placeholder="Amount (₹)" required>
                </div>
                <button type="submit" name="add_expense" class="btn btn-danger w-100">Save Expense</button>
            </form>
        </div>

        <!-- Expense Records -->
        <h4>All Expenses Log</h4>
        <ul class="list-group">
            {% for e in expenses %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>{{ e.description }}</strong>: ₹{{ e.amount }} <small class="text-muted">({{ e.date }})</small></span>
                <form method="POST" class="mb-0">
                    <input type="hidden" name="expense_id" value="{{ e.id }}">
                    <button type="submit" name="delete_expense" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </li>
            {% else %}
            <li class="list-group-item text-muted">No expenses recorded.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
