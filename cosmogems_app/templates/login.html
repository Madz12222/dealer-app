<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Portal Login - Jadijar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Dealer Portal Login</h2>
    
    <form action="/send-otp" method="POST">
        <input type="text" name="mobile" placeholder="Enter Mobile Number" required pattern="[0-9]{10}">
        <button type="submit">Get OTP</button>
    </form>

    <form action="/verify-otp" method="POST" style="margin-top: 20px;">
        <input type="text" name="otp" placeholder="Enter 4-digit OTP" required pattern="[0-9]{4}">
        <button type="submit" style="background: #007bff;">Verify & Login</button>
    </form>
</div>

</body>
</html>
