<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Portal Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; margin-top: 5px; }
        .btn-otp { background-color: #28a745; }
        .btn-login { background-color: #007bff; }
        .hidden { display: none; }
        .alert { font-size: 14px; color: #28a745; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Dealer Portal Login</h2>
    <div id="alert-box" class="alert hidden"></div>

    <!-- Step 1: Mobile Input Form -->
    <form id="otp-form">
        <div class="form-group">
            <label>Enter Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
        </div>
        <button type="button" class="btn-otp" onclick="sendOtp()">Get OTP</button>
    </form>

    <!-- Step 2: OTP Verification Form (Hidden Initially) -->
    <form id="login-form" action="/verify-otp" method="POST" class="hidden" style="margin-top: 20px;">
        <div class="form-group">
            <label>Enter 4-digit OTP</label>
            <input type="text" id="otp" name="otp" placeholder="Enter OTP" required maxlength="4">
        </div>
        <button type="submit" class="btn-login">Verify & Login</button>
    </form>
</div>

<script>
    function sendOtp() {
        const mobile = document.getElementById('mobile').value;
        if(mobile.length < 10) {
            alert('Please enter a valid mobile number');
            return;
        }

        fetch('/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'mobile=' + encodeURIComponent(mobile)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('otp-form').classList.add('hidden');
                const loginForm = document.getElementById('login-form');
                loginForm.classList.remove('hidden');
                
                const alertBox = document.getElementById('alert-box');
                alertBox.textContent = "OTP sent to WhatsApp successfully!";
                alertBox.classList.remove('hidden');
            } else {
                alert('Error sending OTP');
            }
        })
        .catch(err => {
            // Fallback if response isn't pure JSON
            document.getElementById('otp-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        });
    }
</script>

</body>
</html>
